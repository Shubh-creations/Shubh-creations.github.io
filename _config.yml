# Jekyll Site Configuration for Shubham Pawar // Founder & Systems Architect
title: "Shubham Pawar // Founder & Systems Architect"
tagline: "Autonomous Enterprise AI & High-Scale Distributed Systems"
description: "Founder & Systems Architect. Building autonomous agents, high-scale distributed architecture, and frontier software systems."
author: "Shubham Pawar"
twitter_username: "builtfor101"
github_username: "Shubh-creations"
url: "https://shubh-creations.github.io"
baseurl: ""

# Jekyll Theme (Native GitHub Pages supported)
theme: jekyll-theme-minimal

# Plugins supported by GitHub Pages
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - push-to-github.bat
  - push-to-github.ps1
  - scratch/
  - .github/
