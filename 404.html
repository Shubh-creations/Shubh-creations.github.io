<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Shubham Pawar</title>
  <meta http-equiv="refresh" content="3;url=/" />
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#000000" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-yellow {
      background-color: #FFC93C;
      color: #000000;
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-yellow:hover {
      background-color: #ffd86b;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px -4px rgba(255, 201, 60, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 antialiased bg-[#000000]">
  <div class="max-w-md w-full text-center space-y-6 p-8 rounded-2xl bg-[#0B0B0E] border border-white/10 shadow-2xl">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#FFC93C]/10 border border-[#FFC93C]/30 text-[#FFC93C] font-mono text-2xl font-bold">
      404
    </div>
    
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white mb-2">Page Not Found</h1>
      <p class="text-sm text-[#D9DADC] leading-relaxed">
        The route you requested doesn't exist or is currently re-indexing. You will be redirected to the flagship portfolio in <span id="countdown" class="font-mono text-[#FFC93C] font-bold">3</span>s.
      </p>
    </div>

    <div class="pt-2">
      <a href="/" class="btn-yellow inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full text-xs uppercase tracking-wider font-bold">
        <span>Return to Portfolio</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>

    <div class="pt-4 border-t border-white/5 flex items-center justify-between text-[11px] font-mono text-zinc-500">
      <span>SHUBHAM PAWAR</span>
      <a href="https://github.com/Shubh-creations" target="_blank" rel="noopener noreferrer" class="hover:text-white">GitHub ↗</a>
    </div>
  </div>

  <script>
    let seconds = 3;
    const countdownEl = document.getElementById('countdown');
    const interval = setInterval(() => {
      seconds--;
      if (countdownEl) countdownEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>
</html>
